<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz Σ</title><link rel="stylesheet" href="../style.css"></head><body><header><h1>🔢 Laboratorio 02 — Matriz de covarianza viva</h1><p>Construye Σ y observa su efecto gráfico.</p></header><main><a class="back" href="../">← Volver</a><div class="grid"><section class="panel"><h2>Parámetros</h2><div class="control"><label>σX: <b id="sxv">2.0</b></label><input id="sx" type="range" min="5" max="40" value="20" step="5"></div><div class="control"><label>σY: <b id="syv">3.0</b></label><input id="sy" type="range" min="5" max="40" value="30" step="5"></div><div class="control"><label>ρ: <b id="rv">0.60</b></label><input id="r" type="range" min="-90" max="90" value="60" step="5"></div><div class="formula">Var(X)=σX²<br>Var(Y)=σY²<br>Cov(X,Y)=ρσXσY</div></section><section class="panel"><h2>Matriz Σ</h2><div class="matrix"><div class="cell diag"><small>Var(X)</small><br><b id="m11">-</b></div><div class="cell"><small>Cov(X,Y)</small><br><b id="m12">-</b></div><div class="cell"><small>Cov(Y,X)</small><br><b id="m21">-</b></div><div class="cell diag"><small>Var(Y)</small><br><b id="m22">-</b></div></div><div class="note"><b>Diagonal:</b> varianzas.<br><b>Fuera:</b> covarianzas.</div></section></div><section class="panel" style="margin-top:16px"><h2>Distribución resultante</h2><svg id="plot" viewBox="0 0 600 390"></svg><div class="stat-row"><div class="stat"><small>Var(X)</small><b id="vx">-</b></div><div class="stat"><small>Var(Y)</small><b id="vy">-</b></div><div class="stat"><small>Cov</small><b id="cv">-</b></div><div class="stat"><small>r observado</small><b id="ro">-</b></div></div></section></main><script src="app.js"></script></body></html>
