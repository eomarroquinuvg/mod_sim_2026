<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Correlación</title><link rel="stylesheet" href="../style.css"></head><body><header><h1>📈 Laboratorio 01 — Correlación visual</h1><p>Mueve ρ y observa cómo cambia X con Y.</p></header><main><a class="back" href="../">← Volver al laboratorio</a><div class="grid"><section class="panel"><h2>Controles</h2><div class="control"><label>ρ: <b id="rhoVal">0.80</b></label><input id="rho" type="range" min="-95" max="95" value="80" step="5"></div><div class="control"><label>Puntos: <b id="nVal">300</b></label><input id="n" type="range" min="50" max="600" value="300" step="50"></div><div class="controls"><button class="btn" id="regen">Nueva muestra</button><button class="btn secondary preset" data-rho="-80">ρ=-0.8</button><button class="btn secondary preset" data-rho="0">ρ=0</button><button class="btn secondary preset" data-rho="80">ρ=0.8</button></div><div class="formula">X = Z1<br>Y = ρZ1 + sqrt(1-ρ²)Z2</div><div class="stat-row"><div class="stat"><small>ρ solicitado</small><b id="target">-</b></div><div class="stat"><small>r observado</small><b id="observed">-</b></div><div class="stat"><small>Cov(X,Y)</small><b id="cov">-</b></div></div></section><section class="panel"><h2>Nube de puntos</h2><svg id="plot" viewBox="0 0 600 390"></svg></section></div><section class="panel" style="margin-top:16px"><h2>Interpretación</h2><div id="explain" class="note"></div></section></main><script src="app.js"></script></body></html>
