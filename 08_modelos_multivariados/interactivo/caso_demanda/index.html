<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demanda y entrega</title><link rel="stylesheet" href="../style.css"></head><body><header><h1>📦 Laboratorio 04 — Demanda y tiempo de entrega</h1><p>Simula 1000 escenarios y observa la zona de riesgo.</p></header><main><a class="back" href="../">← Volver</a><div class="grid"><section class="panel"><h2>Parámetros</h2><div class="control"><label>Correlación r: <b id="rv">0.60</b></label><input id="r" type="range" min="0" max="95" value="60" step="5"></div><div class="control"><label>Umbral demanda: <b id="dv">120</b></label><input id="dthr" type="range" min="105" max="145" value="120" step="5"></div><div class="control"><label>Umbral entrega: <b id="tv">6.0</b> días</label><input id="tthr" type="range" min="50" max="75" value="60" step="5"></div><div class="controls"><button class="btn" id="regen">Simular 1000</button><button class="btn secondary preset" data-r="0">r=0</button><button class="btn secondary preset" data-r="60">r=0.6</button><button class="btn secondary preset" data-r="90">r=0.9</button></div><div class="note">Demanda μ=100, σ=20<br>Entrega μ=5, σ=1<br>Cov=r×20×1</div></section><section class="panel"><h2>Indicadores</h2><div class="stat-row"><div class="stat"><small>r observado</small><b id="ro">-</b></div><div class="stat"><small>Covarianza</small><b id="co">-</b></div><div class="stat"><small>Riesgos</small><b id="riskN">-</b></div><div class="stat"><small>Prob. riesgo</small><b id="riskP">-</b></div></div><div id="interpret" class="note"></div></section></div><section class="panel" style="margin-top:16px"><h2>1000 escenarios</h2><div class="legend"><span><i class="dot" style="background:#008D36"></i> normal</span><span><i class="dot" style="background:#c5392f"></i> riesgo conjunto</span></div><svg id="plot" viewBox="0 0 600 390"></svg></section></main><script src="app.js"></script></body></html>
